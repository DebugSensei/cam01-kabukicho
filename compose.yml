# Просмотр результатов прогона на localhost:8080.
#   docker compose up -d      поднять
#   docker compose down       остановить
# Пайплайн здесь не запускается — он на хосте, ему нужен GPU.
services:
  looq-out:
    build: ./docker
    container_name: looq-out
    ports:
      # ТОЛЬКО петля. Без адреса Docker слушает 0.0.0.0, и out/ вместе с часом
      # необезличенного уличного видео уходит в локальную сеть. Просмотр
      # результатов — операция для одной машины.
      - "127.0.0.1:8080:80"
    volumes:
      # Только чтение: контейнер обязан быть не способен испортить артефакты.
      - ./out:/usr/share/nginx/html:ro
    restart: unless-stopped
