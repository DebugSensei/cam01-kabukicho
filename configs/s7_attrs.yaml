# S7 attrs — атрибуты (ОПЦИОНАЛЬНЫЙ этап)
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s7_attrs"

# S7 режется первым при отставании от графика (CLAUDE.md). Пропуск этапа — легальное
# состояние: S8 обязан вывести соответствующие метрики как неизмеренные, а не как нули.
input:
  tracks: "track/tracks.parquet"
  video: "raw/peak_hour.ts"   # кропы берутся из кадров
output:
  attrs: "attr/tracks_attr.parquet"

model:
  weights: null
  imgsz: 224
  device: "cuda:0"
  precision: "fp16"
  tracker: null
  tracker_version: null

attrs:
  enabled: true               # возвращён в скоуп 2026-09-04 по требованию визуала
  palette: ["black", "white", "grey", "red", "orange", "yellow", "green",
            "blue", "purple", "pink", "other"]

  # Область ТОРСА долями высоты рамки. Голова и ноги исключены: иначе цвет
  # волос и асфальта попадёт в "верхнюю одежду". Бока обрезаны, потому что
  # у краёв рамки чаще виден фон, а не человек.
  # Контраст торса к локальному фону. Отделяет цвет ОДЕЖДЫ от цвета
  # ОСВЕЩЕНИЯ: подсветка красит человека и стену за ним одинаково.
  # Замер 2026-09-08 по пруф-кропам, расхождение тона торс/фон:
  #   оранжевый  2.1 град, насыщенность 96 против 99  <- лампа
  #   синий     12.5 град, насыщенность 81 против 38  <- ткань
  #   чёрный    31.8 град, насыщенность 100 против 42 <- ткань
  # НЕ ОТКАЛИБРОВАНО: пороги разделяют измеренные значения, но на размеченных
  # кропах не проверялись, потому что размеченных кропов нет. Класс с таким
  # признаком не выбрасывается, а помечается background_match и уходит из
  # покрытия — правило 7.
  bg_edge_frac: 0.12          # доля ширины кропа с каждого края, считаемая фоном
  bg_min_hue_dist_deg: 6.0    # ближе этого по тону — торс неотличим от фона
  bg_sat_ratio_tol: 0.25      # и насыщенность в пределах +-25 % от фоновой

  torso_top_frac: 0.22        # ниже головы. НЕ ОТКАЛИБРОВАНО.
  torso_bottom_frac: 0.55     # выше пояса. НЕ ОТКАЛИБРОВАНО.
  torso_side_frac: 0.18       # отступ от боков рамки. НЕ ОТКАЛИБРОВАНО.

  # Ахроматика решается ДО тона: при низкой насыщенности тон определяется
  # случайным перевесом каналов и шумит.
  v_black_max: 55             # темнее — чёрный. НЕ ОТКАЛИБРОВАНО.
  v_white_min: 185            # светлее и ненасыщенный — белый. НЕ ОТКАЛИБРОВАНО.
  # ВОЗВРАТ к 45 (решение владельца 2026-09-04). Значение 130 не измеряло
  # хрому — оно объявляло ахроматичным почти всё и тем МАСКИРОВАЛО цветовой
  # сдвиг камеры: 85% выборки схлопывалось в "серый", куда попадали тёмно-синий,
  # бежевый и чёрный. Сдвиг теперь КОМПЕНСИРУЕТСЯ балансом белого по мостовой
  # (блок white_balance ниже), а не прячется порогом.
  # 45 — исходное значение. НЕ ОТКАЛИБРОВАНО: на размеченных кропах не проверялось.
  s_achromatic_max: 45
  min_agreement: 0.35         # доля пикселей области, согласных с классом.
                              # Ниже — цвет не определён, а не "other":
                              # пёстрая куртка это не цвет. НЕ ОТКАЛИБРОВАНО.
  min_crop_h_px: 96           # ниже цвет верха неразличим от фона. НЕ ОТКАЛИБРОВАНО.
  n_crops_per_track: 8        # класс выбирается ГОЛОСОВАНИЕМ по кропам: один кадр
                              # ловит блик вывески или тень, восемь — уже нет.
                              # НЕ ОТКАЛИБРОВАНО.
  # Баланс белого по опорной поверхности. Мостовая внутри ROI серая по смыслу:
  # её медианный BGR берётся как серая точка и приводится к нейтральной.
  white_balance:
    enabled: true
    reference: "road_surface"
    reference_is_measured: false   # "мостовая серая" — ДОПУЩЕНИЕ, не замер.
                                   # Если плитка тёплая, grey-world по ней
                                   # перекорректирует в синеву — ровно та же
                                   # ошибка с другой стороны.
    n_frames: 50                # кадров на оценку серой точки
    person_dilate_px: 8         # рамки плотно облегают человека, а тень и край
                                # пальто выходят за них. НЕ ОТКАЛИБРОВАНО.
    s_max_for_grey: 160         # выше — разметка, неон, краска машин. Отсев
                                # частично кольцевой, поэтому порог взят
                                # заведомо выше измеренного сдвига (медиана S
                                # кадра ~60), а доля отсева идёт в артефакт.
    clip_low: 5                 # задавленное в чёрное — шум сенсора
    clip_high: 250              # выбитое в белое уже потеряло цветность и
                                # ЗАНИЖАЕТ видимый сдвиг
    min_pixels: 20000           # меньше — серая точка по обрезку
    min_channel_level: 8        # ниже — коэффициент взрывается
    gain_min: 0.5               # выход за границы означает, что маска не
    gain_max: 2.0               # мостовая, и этап обязан упасть громко
    max_clipped_frac_for_ok: 0.02   # клиппинг меняет ТОН, а тон — весь вход

  # Запрещено по решению проекта: пол, возраст, этничность. Причина двойная —
  # приватность (правило 9) и отсутствие ground truth для гейта (правило 7).
  forbidden: ["gender", "age", "ethnicity"]

gates:
  min_top_color_accuracy: 0.70   # НЕ ОТКАЛИБРОВАНО
  n_labelled_crops: 150          # из CLAUDE.md

evidence_claims:
  - "claim.attrs.top_color"      # кропы с предсказанным и истинным цветом
