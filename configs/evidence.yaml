# Сбор кадров-доказательств (пруфов) — общий для всех этапов
# Правило 1: любое число в отчёте должно уметь показать кадры, на которых оно стоит.
# Правило 9: кропы лиц на диск не сохраняются.
schema_version: "1"
stage: "evidence"

evidence:
  root: "evidence"
  jpeg_quality: 90            # ниже 90 артефакты сжатия начинают мешать глазами проверять кроп

privacy:
  # Обезличивание в два шага: ПИКСЕЛИЗАЦИЯ, затем гаусс. Порядок принципиален.
  # Чистая гауссиана — обратимая свёртка, деблюр по ней восстанавливает черты лица.
  # Пикселизация уничтожает информацию мельче блока безвозвратно, гаусс сверху
  # убирает резкие границы блоков, по которым иначе оценивают исходные значения.
  face_blur_top_frac: 0.30    # верхние 30% высоты кропа. Поднято с 0.22 (решение владельца
                              # 2026-09-03): на дальнем плане человек занимает меньше пикселей,
                              # голова оказывается выше в кропе, и 22% её не накрывали.
  pixelate_factor: 16         # во сколько раз область головы уменьшается перед обратным
                              # увеличением. При кропе шириной 80 px блок выходит 5 px —
                              # черты лица внутри блока не восстановимы.
  blur_kernel_frac: 0.35      # ядро гаусса как доля меньшей стороны области головы.
                              # НЕ ОТКАЛИБРОВАНО: проверено на синтетике в тестах, не на реальных
                              # кропах. Блокер снимается после scripts/check_blur.py (см. JOURNAL).
  blur_sigma_frac: 0.333      # sigma = k/3: при меньшей sigma гауссиана внутри ядра почти не размывает
  min_kernel_px: 5            # нижняя граница: на маленьких кропах доля даёт 1-3 px, чего мало

sampling:
  n_per_claim: 12             # сколько кадров оставить на утверждение
  n_strata: 3                 # верхний / средний / нижний квантиль уверенности
  # Отбор СТРАТИФИЦИРОВАННЫЙ, не top-N. Top-N систематически показывает лучшие случаи
  # и создаёт ложное впечатление качества. Остаток от деления идёт в НИЖНИЕ страты:
  # слабые примеры информативнее всего для аудита.
  seed: 20260903              # фиксирован, чтобы отбор был воспроизводим между прогонами
  max_candidates_per_claim: 2000   # потолок памяти; сверх него работает reservoir sampling,
                                   # а число отброшенных кандидатов пишется в статистику
