# S6 attention — остановки и ориентация на витрину
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s6_attn"

input:
  tracks: "track/tracks.parquet"
  orient: "pose/orient.parquet"
  zones: "zones/zones.geojson"
  homography: "calib/homography.json"   # сверяется sha: зоны обязаны
                                        # быть спроецированы ЭТОЙ калибровкой
output:
  events: "attn/events.parquet"

model: null                   # чистая геометрия по артефактам S4 и S5

# Формулы из CLAUDE.md, раздел "Ключевые определения".
# Менять ТОЛЬКО с записью в docs/JOURNAL.md.
stop:
  # ДВА РЕЖИМА. Какой действует, определяет calib_status из calib/homography.json.
  #   absolute — порог в м/с. Работает только при откалиброванном масштабе.
  #   relative — порог в долях МЕДИАННОЙ СКОРОСТИ ПОТОКА. Работает всегда,
  #              потому что отношение скоростей от масштаба не зависит.
  # При calib_status = angles_ok_scale_unverified метров нет, и absolute
  # запрещён: 0.3 "м/с" в условных единицах — это просто выдуманное число.
  mode: "relative"
  speed_thr_mps: 0.30         # из CLAUDE.md: "скорость < 0.3 м/с". Для mode: absolute.
  speed_thr_frac_of_median: 0.25  # остановился = медленнее 25% медианы потока.
                              # Медиана считается по этому же прогону, поэтому
                              # порог самонастраивается под сцену и не требует метров.
                              # НЕ ОТКАЛИБРОВАНО.
  min_duration_s: 1.5         # из CLAUDE.md: "длительностью > 1.5 с".
                              # Секунды известны всегда: fps от масштаба не зависит.

gaze:
  # Определение переписано 2026-09-03 (решение владельца, см. JOURNAL).
  # Первичный тест ГЕОМЕТРИЧЕСКИЙ, а не угловой: пересечение сектора ориентации
  # с отрезком фасада. Прежняя формулировка "под углом < 30 градусов" была
  # двусмысленной (угол к нормали или к линии фасада) и вычеркнута.
  max_dist_m: 8.0             # из CLAUDE.md: длина луча, "на дистанции < 8 м"
  max_dist_units_when_unscaled: 1.6  # 8 м при оценённой высоте камеры 5.04 м.
                              # ЕДИНИЦА ПЛАНА = ВЫСОТА КАМЕРЫ, а не высота кадра:
                              # при заглушке stub_affine здесь стояло 0.5, что
                              # означало полкадра и давало сектор во всю сцену —
                              # отсюда были завышенные 50-94% "повёрнут к витрине".
                              # НЕ ОТКАЛИБРОВАНО: зависит от неподтверждённого масштаба.

  yaw_uncertainty_deg: 25.5   # ПОЛУШИРИНА СЕКТОРА, а не порог решения.
                              # Это угловая неопределённость оценки yaw: луч расширяется
                              # в сектор +-yaw_uncertainty_deg, и проверяется пересечение
                              # сектора с отрезком фасада.
                              # ОТКАЛИБРОВАНО 2026-09-04 по ручной разметке:
                              # labels/s5_orient_24.jsonl, n=24, MAE = 25.5 град,
                              # 95% бутстрэп [18.7, 32.7], медиана ошибки 24.5,
                              # ошибок больше 90 град — НОЛЬ (знак и система координат
                              # верны, разворотов на 180 нет).
                              # Прежние 15.0 были заглушкой и делали сектор ВДВОЕ уже
                              # оправданного, то есть систематически недосчитывали
                              # попадания в фасады.
                              # ОГОВОРКА: разметка снята на утреннем трёхминутном клипе,
                              # а метрики считаются по вечернему часу. MAE — свойство
                              # модели, но на плотной вечерней сцене люди перекрывают
                              # друг друга сильнее, и там он может быть хуже.

  min_score_for_event: 0.20   # трек считается ПОВЁРНУТЫМ к витрине, если сектор
                              # накрывал фасад не меньше этой доли времени.
                              # Без порога засчитывался ЛЮБОЙ единичный кадр,
                              # и за 20 секунд мимо витрины это случалось почти
                              # с каждым: доли выходили 50-100%. Мгновенный поворот
                              # головы — не внимание к витрине.
                              # НЕ ОТКАЛИБРОВАНО.

  grazing_max_deg: 70.0       # защита от скользящего угла: если луч падает на фасад
                              # под углом больше 70 градусов от нормали, фасад виден
                              # с ребра и пересечение ненадёжно. Такое событие помечается
                              # low_confidence, в основной агрегат не идёт, но СОХРАНЯЕТСЯ
                              # в данных (правило 7).
                              # НЕ ОТКАЛИБРОВАНО.

gates:
  min_precision_stop_and_gaze: 0.70   # НЕ ОТКАЛИБРОВАНО
  n_manual_events: 100                # из CLAUDE.md

evidence_claims:
  - "claim.attn.stop_and_orient"   # главное утверждение отчёта — обязано иметь пруфы
  - "claim.attn.stop_only"
  - "claim.attn.false_positive"    # пограничные случаи: именно они рушат precision
