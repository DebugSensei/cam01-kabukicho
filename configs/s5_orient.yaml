# S5 pose+orient — ориентация корпуса и головы
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s5_orient"

input:
  tracks: "track/tracks.parquet"
  homography: "calib/homography.json"   # нужна камера, а не только гомография земли
  clip: "raw/peak_hour.ts"   # сквозной прогон по отладочному клипу      # в tracks.parquet нет рамок, кроп брать неоткуда
output:
  orient: "pose/orient.parquet"

model:
  weights: "models/yolo11m-pose.pt"
  imgsz: 960                  # поза требует меньшего входа, чем детекция: работаем по кропам трека
  device: "cuda:0"
  precision: "fp16"
  batch: 16                   # НЕ ОТКАЛИБРОВАНО: подбирается замером VRAM
  tracker: null
  tracker_version: null

orient:
  # Формулировка идёт в UI и в отчёт ДОСЛОВНО:
  # "Ориентация — это поворот корпуса/головы, а не направление взгляда."
  angle_zero_ru: "0 градусов = направление +x плана (вдоль улицы), против часовой стрелки, [0, 360)"
  kp_conf_thr: 0.30           # НЕ ОТКАЛИБРОВАНО: дефолт ultralytics для keypoints
  min_kpts_valid: 4           # меньше 4 видимых точек — линию плеч не построить, угол не пишем.
                              # НЕ ОТКАЛИБРОВАНО.
  min_bbox_h_px: 64           # ниже 64 px поза шумит сильнее, чем полезна. НЕ ОТКАЛИБРОВАНО.

  # Высоты плеч и ушей больше НЕ НУЖНЫ и убраны (было shoulder_height_ratio
  # и ear_height_ratio, оба НЕ ОТКАЛИБРОВАНО). Отрезок плеч горизонтален, поэтому
  # его направление на плане определяется прямой в кадре, а не высотой точек.
  # Побочная выгода: метод работает и с запасным путём калибровки, где камеры нет.

  match_max_dist_px: 60        # поза привязывается к треку по опорной точке.
                               # Дальше этого расстояния считаем, что пары нет:
                               # лучше строка без угла, чем угол не тому человеку.
                               # НЕ ОТКАЛИБРОВАНО.

gates:
  max_yaw_mae_deg: 25.0       # НЕ ОТКАЛИБРОВАНО: порог обязан быть выставлен после первой разметки
  n_labelled_people: 50       # сокращено владельцем с 200 (2026-09-04)
  labels: "labels/s5_orient_200.jsonl"   # ручная разметка; пока не существует
  min_pose_coverage_frac: 0.40  # ниже 40% покрытия угол есть у меньшинства треков,
                              # и любая доля «повёрнут к витрине» считается по
                              # нерепрезентативной выборке. НЕ ОТКАЛИБРОВАНО.

evidence_claims:
  - "claim.orient.body_yaw"        # кадры с нарисованной стрелкой ориентации корпуса
  - "claim.orient.low_conf"        # где угол посчитан с низкой уверенностью
  - "claim.orient.missing"         # где угла нет вообще — это доля непокрытия, правило 7
