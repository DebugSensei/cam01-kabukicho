# S1 calib — гомография кадр->план земли
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s1_calib"

input:
  # S1 самодостаточен: он НЕ ждёт артефактов S3/S4 и не может их ждать —
  # S3 пишет foot_x_m, для чего нужна уже готовая гомография.
  # Порядок в Makefile строго S1 -> S3 -> S4.
  clip: "raw/clip_debug_2030JST.ts"
  hints: "configs/calib_hints.yaml"      # создаётся scripts/pick_hints.py
  detect_config: "configs/s3_detect.yaml"  # параметры инференса берутся ОТТУДА,
                                           # чтобы калибровка и пайплайн считали
                                           # одних и тех же людей
output:
  homography: "calib/homography.json"
  pilot_dir: "calib/pilot"               # пилот НИКОГДА не пишет в det/ и track/
  debug_dir: "calib"

model: null                   # ЭТОТ ключ пуст, но модель этап ГОНЯЕТ: веса позы
                              # лежат ниже в pose_weights, и s1_calib.py:164 их
                              # грузит. Прежний комментарий «модели нет» был
                              # неверен (правило 5) и он же причина того, что в
                              # run_manifest.json блок модели у s1_calib пустой,
                              # хотя калибровка зависит от этого инференса.

homography:
  direction: "px_to_m"        # матрица ВСЕГДА переводит пиксели в метры. Обратной в контракте нет,
                              # чтобы нельзя было перепутать сторону.

  # ЗАПАСНОЙ ПУТЬ, включён 2026-09-04 решением владельца: клики по точкам схода
  # на ночной сцене не даются, четыре попытки дали разброс до 61 px и гейт валился.
  #   vanishing_points     — точки схода + рост людей. Даёт МЕТРЫ. Основной.
  #   manual_ground_plane  — четыре угла прямоугольного участка мостовой с известной
  #                          пропорцией. Плоскость земли с точностью до масштаба.
  #   (auto_vp_height — прежнее имя vanishing_points, принимается как синоним)
  #   self_calib_pedestrians — ОСНОВНОЙ. Геометрия из людей в уже посчитанных
  #                            детекциях; клики нужны только для направления улицы.
  #                            Масштаб из ширины улицы, рост — независимая проверка.
  method: "self_calib_pedestrians"

  # Если основной путь не даёт годной калибровки — НЕ падаем, а переходим на
  # аффинную заглушку (решение владельца 2026-09-04). Труба должна работать
  # целиком даже с непроверенными числами; качество вторично, честность нет.
  fallback_to_stub_affine: true

  # Допущения модели камеры. Относятся ТОЛЬКО к пути auto_vp_height: главная
  # точка в центре кадра, квадратный пиксель, нулевой перекос. Это ДОПУЩЕНИЯ,
  # а не измерения, и они идут в отчёт.
  # Путь manual_ground_plane их не использует: он не восстанавливает камеру,
  # только плоскость земли.
  assume_principal_point_center: true
  assume_square_pixel: true

ground_rect:
  # Пропорция обведённого участка: сторона TL->TR к стороне TL->BL.
  # Задаётся человеком по тому, что он обводит (плитка, разметка, край мостовой).
  # Это ЕДИНСТВЕННОЕ, что известно про участок, и от него зависит вся геометрия
  # плоскости — ошибка в пропорции превращается в сдвиг всех углов.
  aspect_tl_tr_over_tl_bl: 2.0
  source: "calib/ground_rect.json"   # создаётся scripts/pick_ground.py

  # Статус калибровки уходит в артефакт и в отчёт. Метры не считаются, и число,
  # названное метром, было бы враньём.
  calib_status: "angles_ok_scale_unverified"

self_calib:
  # Фильтры детекций, годных для геометрии. Строже, чем у детектора: кривая
  # рамка портит и горизонт, и вертикальную точку схода.
  min_conf: 0.5
  min_bbox_h_px_for_geometry: 80   # ниже ошибка в 2 px даёт 2.5% ошибки отрезка
  max_neighbour_iou: 0.2
  edge_margin_px: 2

  min_depth_sep_px: 80        # пары людей ближе по глубине дают почти совпадающие
                              # прямые, и точка пересечения улетает от шума
  horizon_ransac_tol_px: 25.0 # разброс роста входит как шум; на синтетике при
                              # sigma=0.07 м это даёт 37% инлаеров и фокус с
                              # ошибкой 0.4%. НЕ ОТКАЛИБРОВАНО.
  horizon_min_inlier_frac: 0.20  # доля инлаеров здесь плохой показатель качества,
                              # настоящие проверки ниже по трубе. НЕ ОТКАЛИБРОВАНО.

  # Вертикальная VP считается ТОЛЬКО по позам: у рамки низ и верх имеют
  # одинаковый x, отрезок вертикален по построению, и точки схода из него нет.
  pose_weights: "models/yolo11m-pose.pt"
  pose_frames: 300            # кадров под позу для вертикальной точки схода
  vertical_inlier_angle_deg: 4.0  # инлаер меряется УГЛОМ, не пикселями: точка
                              # схода стоит в тысячах пикселей, и там 30 px это
                              # 0.34 градуса — недостижимо для отрезка в 160 px.
                              # НЕ ОТКАЛИБРОВАНО.
  vertical_min_inlier_frac: 0.30 # НЕ ОТКАЛИБРОВАНО

  target_height_m: 1.68       # ЕДИНСТВЕННАЯ КОНСТАНТА, ОТ КОТОРОЙ ЛИНЕЙНО
                              # ЗАВИСИТ КАЖДЫЙ МЕТР В ПРОЕКТЕ. Медиана роста
                              # взрослого населения Японии, смешанная выборка по
                              # полу. Это путь self_calib_pedestrians — тот, что
                              # дал опубликованную геометрию (s1_calib.py:190,
                              # :403). Ниже в блоке scale лежит 1.65 для
                              # ЛЕГАСИ-пути vanishing_points, который в этом
                              # прогоне не использовался.
                              # НЕ ОТКАЛИБРОВАНО ПО ЭТИМ ДАННЫМ: значение взято
                              # из общего знания о популяции, а не измерено на
                              # улице Кабуки-тё, и неопределённость не задана.
                              # Обе независимые проверки, которых требует гейт,
                              # не выполнены: в артефакте нет ни pilot_speeds_mps,
                              # ни facade_baselines. Сдвиньте это число на 3 %, и
                              # на 3 % сдвинутся все метры, все м/с и окно
                              # взгляда 8 м. Сравнения витрин между собой это не
                              # затрагивает, абсолютные величины — затрагивает.
  implied_width_plausible_range_m: [4.6, 5.6]  # если подразумеваемая ширина
                              # L1-L3 попадает сюда, версия о том, что эталон
                              # 6.06 м замерен здание-здание, а кликнут бордюр,
                              # считается подтверждённой, и масштаб берётся
                              # из роста (calib_status: scale_from_height).
                              # Диапазон задан владельцем 2026-09-04.

  vp_horizon_tol_per_px: 0.072  # допуск РАСТЁТ с удалением точки схода от центра
                              # кадра. Измерено на синтетике: ошибка горизонта
                              # примерно 0.024 * расстояние (566 px -> 4.7 px,
                              # 943 -> 22.4, 1612 -> 40.1, 4565 -> 110.9).
                              # Берём тройной запас. Фиксированный порог для
                              # близкой точки схода слишком мягок, для далёкой
                              # запретителен. НЕ ОТКАЛИБРОВАНО.
  vp_horizon_tol_px: 20.0     # постоянная часть допуска. Точка схода улицы
                              # из кликов обязана лежать на
                              # горизонте по пешеходам. Две независимые оценки
                              # одной величины; расхождение больше допуска
                              # означает, что верить нельзя ни одной.
                              # НЕ ОТКАЛИБРОВАНО.

vp:
  # Инлаер — отрезок, чья прямая проходит ближе этого расстояния от кандидата VP.
  inlier_tol_px: 25.0         # Поднято с 4.0 после замера на реальном кадре, и это
                              # не подкрутка порога, а исправление ошибки: допуск
                              # меряет расстояние от кандидата VP до ПРЯМОЙ отрезка.
                              # Отрезок длиной 100 px с неопределённостью направления
                              # ~1 градус промахивается мимо VP, удалённой на 1000 px,
                              # на 1000*sin(1) = 17 px. Требовать 4 px значило требовать
                              # от LSD точности лучше 0.25 градуса — недостижимо.
                              # Замер на кадре: инлаеров при 4 px — 3, при 20 px — 21,
                              # при 40 px — 47. См. docs/DECISIONS.md.
  min_inliers: 15             # меньше — точка схода держится на шуме. Снижено с 20:
                              # на этом кадре при допуске 25 px набирается около 25
                              # отрезков, запас невелик. НЕ ОТКАЛИБРОВАНО.
  holdout_frac: 0.30          # 70/30: 70% в оценку VP, 30% удерживаются и дают невязку.
                              # Клики пользователя — только затравка, в удержанную выборку не входят.
  seed: 20260903              # фиксирован: разделение 70/30 обязано воспроизводиться
  min_segment_len_px: 40      # короткие отрезки задают направление слишком неточно.
                              # НЕ ОТКАЛИБРОВАНО.
  hint_line_max_residual_px: 6.0  # разброс кликов относительно подогнанной прямой.
                              # Выше — предупреждение: линия подозрительна, точка схода
                              # уедет. Не ошибка: решение перекликать за человеком.
  seed_max_deviation_deg: 25  # насколько уточнённая RANSAC-ом точка схода может
                              # отклониться от затравки. Отклонение меряется УГЛОМ от
                              # центра кадра, а не в пикселях: VP почти горизонтальной
                              # улицы уходит на тысячи пикселей, и там сотня пикселей —
                              # доли градуса, а у близкой VP та же сотня меняет
                              # направление полностью. Больше предела означает, что
                              # RANSAC зацепился за другое семейство параллельных линий.
                              # НЕ ОТКАЛИБРОВАНО.
  street_angle_max_deg: 40    # отрезки-кандидаты для горизонтальной VP: наклон к горизонту
  vertical_angle_min_deg: 60  # и для вертикальной. НЕ ОТКАЛИБРОВАНО.

pilot:
  # Выборка — НЕПРЕРЫВНЫЕ ПАЧКИ, равномерно разнесённые по длине клипа
  # (решение владельца 2026-09-03, было 300 одиночных кадров).
  # Одиночные давали шаг 0.6 с между наблюдениями: ByteTrack в толпе на таком
  # шаге связывает ненадёжно и медианная скорость выходит смещённой.
  n_bursts: 30                # столько же точек по времени, сколько раньше было кадров/10
  burst_frames: 10            # кадров подряд в пачке; итого 30 x 10 = 300 кадров
                              # ВНИМАНИЕ: 10 кадров при 30 fps это 0.33 с. Из-за этого
                              # min_track_s пришлось опустить с 2.0 до 0.30 — трек
                              # физически не может быть длиннее своей пачки.
                              # ИЗМЕРЕНО (симуляция, истинная скорость 1.30 м/с,
                              # шум позиции на плане 0.15 м, 400 треков):
                              #   10 кадров (0.33 с) -> медиана 1.415, смещение +8.9%
                              #   20 кадров (0.67 с) -> 1.308, +0.6%
                              #   30 кадров (1.00 с) -> 1.293, -0.6%
                              #   45 кадров (1.50 с) -> 1.302, +0.2%
                              # Рекомендация исполнителя: burst_frames: 30 и
                              # min_track_s: 1.0 — смещение падает с 8.9% до 0.6%.
                              # Оставлено 10 по решению владельца. См. docs/DECISIONS.md.
  min_conf: 0.5               # выше порога детекции S3 (0.25): для замера роста нужна
                              # уверенная рамка, а не всё, что детектор счёл человеком
  edge_margin_px: 2           # бокс, касающийся края, обрезан: низ не стопа, верх не макушка
  max_neighbour_iou: 0.2      # в толпе низ бокса лежит на чужой спине. НЕ ОТКАЛИБРОВАНО.
  min_bbox_h_px: 60           # ниже 60 px ошибка в 2 px даёт 3% ошибки роста.
                              # НЕ ОТКАЛИБРОВАНО.
  min_track_s: 0.30           # трек короче отбрасывается. Не может превышать длительность
                              # пачки (burst_frames / fps), иначе этап падает громко:
                              # молча вернуть ноль треков хуже всего.

scale:
  target_height_m: 1.65       # ЛЕГАСИ-путь vanishing_points; в этом прогоне НЕ
                              # ИСПОЛЬЗУЕТСЯ. Рабочее значение — 1.68 выше, в
                              # блоке selfcalib. Два разных числа для одной
                              # величины в одном файле — само по себе повод
                              # спросить, какое настоящее; ответ: то, что читает
                              # s1_calib.py:190 на пути self_calib_pedestrians.
  trim_frac: 0.10             # хвосты по 10% с каждой стороны отбрасываются ДО подгонки:
                              # обрезанные и склеенные детекции дают выбросы в обе стороны

ground_frame:
  x_axis_ru: "вдоль улицы"
  y_axis_ru: "поперёк улицы, от фасада в сторону середины"
  angle_zero_ru: "0 градусов = направление +x плана, отсчёт против часовой стрелки, диапазон [0, 360)"

# Независимое контрольное измерение. НЕ вход калибровки.
control:
  street_width_m: 6.06
  street_width_tolerance_m: 0.4
  # источник: спутник Google/Airbus 2026, сечение 下村ビル ↔ 和田久ビル
  # статус: НЕ вход калибровки, только независимая проверка

gates:
  max_holdout_reproj_error_m: 0.5   # из CLAUDE.md, таблица гейтов. Не менять без записи в JOURNAL.

  # Гейт требует схождения ТРЁХ величин одновременно. Диапазоны расширены
  # относительно исходных в CLAUDE.md (1.60-1.70 и 1.1-1.5) решением владельца
  # 2026-09-03: сила проверки теперь в конъюнкции трёх независимых величин,
  # а не в узости каждой по отдельности. Причина — в docs/DECISIONS.md.
  # --- НЕ независимая проверка ---------------------------------------------- #
  # Масштаб гомографии подбирается ПО МЕДИАНЕ РОСТА, поэтому её попадание
  # в диапазон почти тавтологично: она не подтверждает масштаб, а детектирует
  # грубый сбой подгонки. В гейте печатается отдельной строкой с этой пометкой.
  median_height_range_m: [1.55, 1.75]   # было [1.60, 1.70]

  # --- независимые проверки -------------------------------------------------- #
  # РАЗБРОС роста масштабом не задаётся — его задаёт геометрия. При кривой
  # гомографии оценка роста плывёт с глубиной, и разброс разъезжается даже
  # когда медиана стоит на месте. Это настоящая проверка, в отличие от медианы.
  focal_over_diagonal_range: [0.3, 4.0]   # фокус вне этого диапазона означает
                              # неправдоподобное поле зрения. Из требований владельца.
  height_iqr_max_m: 0.18        # у взрослой популяции IQR роста около 0.09 м;
                                # двойной запас на шум оценки.
                                # НЕ ОТКАЛИБРОВАНО: сузить после первого прогона.
  height_p90_p10_max_m: 0.35    # у взрослой популяции p90-p10 около 0.18 м, тот же запас.
                                # На синтетике с масштабом, плывущим 0.8x..1.25x,
                                # получается 0.60 — то есть порог различает уверенно.
                                # НЕ ОТКАЛИБРОВАНО.

  median_speed_range_mps: [1.0, 1.6]    # было [1.1, 1.5]
  # ширина улицы: control.street_width_m +- 2 * control.street_width_tolerance_m
  street_width_tolerance_factor: 2.0    # 6.06 +- 0.8 м

  min_people: 200               # меньше 200 человек в выборке — медиана роста, а с ней
                                # и весь масштаб, держится на случайности. Из S1_TASK.md.
  min_pilot_samples: 30         # нижняя граница для статистики по разбросу.
                                # НЕ ОТКАЛИБРОВАНО.
  vp_holdout_max_px: 3.0        # невязка удержанных отрезков. НЕ ОТКАЛИБРОВАНО.

  # ВНИМАНИЕ, расхождение в S1_TASK.md: шаг 6 называет диапазон скорости 1.1-1.5,
  # а список падений гейта - 1.0-1.6. Взят диапазон из списка падений гейта,
  # он же совпадает с ранее согласованным. Отмечено в docs/DECISIONS.md.
  height_depth_slope_must_cover_zero: true   # регрессия est_height_m ~ foot_y_m

evidence_claims:
  - "claim.calib.holdout_reprojection"   # отложенные точки: где кликнули и куда спроецировалось
  - "claim.calib.scale_check"            # объект известного размера на плане
