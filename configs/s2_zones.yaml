# S2 zones — полигоны зон в координатах плана
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s2_zones"

input:
  homography: "calib/homography.json"
  clip: "raw/clip_debug_2030JST.ts"    # кадр, по которому идёт ручная обводка
  zones_px: "zones/zones.json"         # обводка в ПИКСЕЛЯХ, создаётся scripts/pick_zones.py
output:
  zones: "zones/zones.geojson"         # артефакт этапа: те же зоны в МЕТРАХ ПЛАНА

# Имена витрин для scripts/pick_zones.py. Ровно четыре, порядок обхода = порядок
# в списке. Скрипт ничего не спрашивает с клавиатуры: он подписывает текущую
# витрину на экране ASCII-токеном (M1..M4), полное имя идёт в zones/zones.json.
zone_names:
  - "M1 角煮/げんかつ"
  - "M2 入口/らーめん"
  - "M3 芝浦ホルモン"
  - "M4 お好み焼き"

# Проверки обводки при сохранении. Падаем со списком ВСЕХ проблем сразу:
# перекликивать двадцать точек из-за одной ошибки за раз слишком долго.
picking:
  min_ground_edge_px: 12      # нижнее ребро короче — направление фасада по нему
                              # не определить. НЕ ОТКАЛИБРОВАНО.
  max_zone_overlap_frac: 0.20 # витрины не должны быть обведены внахлёст.
                              # Соприкосновение вплотную разрешено. НЕ ОТКАЛИБРОВАНО.
  corner_order: ["TL", "TR", "BR", "BL"]  # по часовой стрелке от верхнего левого.
                              # Порядок фиксирован: нижнее ребро BL->BR это след
                              # витрины на земле, и только оно идёт в расчёт взгляда.

model: null

zones:
  coordinate_frame: "plane_m"   # ВНИМАНИЕ: geojson здесь содержит МЕТРЫ ПЛАНА, не широту/долготу
  apron_depth_m: 2.0            # глубина прифасадной полосы, в которой считается остановка.
                                # НЕ ОТКАЛИБРОВАНО: прикидка по ширине тротуара на кадре, рулеткой не мерялось.
  apron_depth_units_when_unscaled: 0.15  # то же, но в УСЛОВНЫХ единицах, когда масштаб
                                # не определён. Метровая глубина там бессмысленна.
                                # 0.15 при единице = высота кадра даёт полосу
                                # примерно в 1/7 кадра. НЕ ОТКАЛИБРОВАНО.
  required_types: ["roi", "facade", "apron"]   # без них S6 нечего считать — падать громко

roi:
  max_depth_m: 28.0            # дальше recall детектора падает. НЕ ОТКАЛИБРОВАНО:
                               # значение обязано быть заменено на границу по кривой recall-по-глубине (гейт S2).

gates:
  min_detections_in_zone_frac: 0.30  # из CLAUDE.md: >=30% детекций попадают хотя бы в одну зону
  n_sample_frames: 100               # из CLAUDE.md

evidence_claims:
  - "claim.zones.roi_boundary"      # кадры на границе ROI: видно, где мы перестаём верить детектору
  - "claim.zones.apron_coverage"    # кадры с людьми внутри и вне apron
