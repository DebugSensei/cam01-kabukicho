# S4 track — трекинг и опорная точка на плане
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s4_track"

input:
  frames: "det/frames.parquet"
  frames_index: "det/frames_index.parquet"
  homography: "calib/homography.json"
  video: "raw/peak_hour.ts"   # только для кропов-пруфов: сам трекинг
                                       # идёт по сохранённым детекциям S3
output:
  tracks: "track/tracks.parquet"

model:
  weights: null
  imgsz: null
  device: "cuda:0"
  precision: "fp16"
  tracker: "bytetrack"        # именно ByteTrack: s4_track.py импортирует
                              # ultralytics.trackers.byte_tracker.BYTETracker.
                              # Прежнее "botsort" попадало в run_manifest.json
                              # и называло в отчёте не тот алгоритм.
  tracker_version: null       # заполняется из версии ultralytics в run_manifest

track:
  match_thresh: 0.80          # НЕ ОТКАЛИБРОВАНО: дефолт botsort
  track_buffer_frames: 30     # сколько кадров держать пропавший трек. При 30 fps это 1 с —
                              # столько человек может быть перекрыт встречным. НЕ ОТКАЛИБРОВАНО.
  new_track_thresh: 0.60      # НЕ ОТКАЛИБРОВАНО
  reid_enabled: true          # эмбеддинги живут только внутри прогона и на диск не пишутся (правило 9)
  track_high_thresh: 0.50     # НЕ ОТКАЛИБРОВАНО: дефолт bytetrack
  track_low_thresh: 0.10      # НЕ ОТКАЛИБРОВАНО
  fuse_score: false           # НЕ ОТКАЛИБРОВАНО
  frame_rate: 30              # частота, с которой трекер считает track_buffer_frames

foot_point:
  # Правило 7 структурно: колонка foot_source обязана нести, откуда взята опорная точка.
  # ankle        — голеностоп виден в позе, точка реально стоит на земле  (ПРЯМОЕ измерение)
  # bbox_bottom  — низ рамки; при перекрытии и обрезке краем это не стопа (КОСВЕННОЕ)
  # hip_est      — экстраполяция вниз от бёдер по оценке роста            (КОСВЕННОЕ)
  priority: ["ankle", "hip_est", "bbox_bottom"]
  # ankle и hip_est берутся из позы, а поза по контракту считается на S5, ПОСЛЕ S4.
  # Читать артефакт S5 из S4 нельзя — это сломало бы направление зависимостей.
  # При pose_enabled=true S4 гоняет модель позы сам, вторым проходом по видео,
  # и поза считается дважды за прогон (здесь и в S5).
  # Пока решение не подтверждено владельцем, флаг выключен, foot_source всегда
  # bbox_bottom, и доля косвенных значений честно равна 100 %.
  pose_enabled: false
  hip_to_foot_ratio: 0.52     # доля роста от бёдер до пола. НЕ ОТКАЛИБРОВАНО: антропометрическая
                              # прикидка, на этих людях не проверялась.

speed:
  window_frames: 9            # окно сглаживания скорости. При 30 fps это 0.3 с — короче порога
                              # остановки 1.5 с, значит остановку окно не размажет. НЕ ОТКАЛИБРОВАНО.
  max_plausible_mps: 4.0      # быстрее — это ошибка проекции, а не бегун. Красный флаг, не фильтр.

gates:
  min_idf1_sparse: 0.75       # НЕ ОТКАЛИБРОВАНО
  min_idf1_dense: 0.60        # плотный кусок отдельно: среднее по обоим маскирует провал.
                              # НЕ ОТКАЛИБРОВАНО.
  eval_minutes: 3             # из CLAUDE.md

evidence_claims:
  - "claim.track.foot_source_indirect"   # треки, где опорная точка косвенная — правило 7
  - "claim.track.id_switch_suspect"      # места, где трекер мог переклеить id
  - "claim.track.speed_outlier"          # скорости у границы правдоподобия
