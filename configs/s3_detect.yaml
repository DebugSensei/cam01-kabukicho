# S3 detect — детекция людей
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s3_detect"

input:
  manifest: "raw/manifest.json"
  # Пока S0 не реализован, источник задаётся здесь. Когда raw/manifest.json
  # станет настоящим, список сегментов обязан приходить оттуда — этап падает,
  # если манифест уже не skeleton, но чтение сегментов ещё не написано.
  video: "raw/peak_hour.ts"   # СКВОЗНОЙ ПРОГОН идёт по отладочному клипу
                                       # (3 мин). Для полного часа заменить на
                                       # raw/peak_1930-2200JST.ts
output:
  frames: "det/frames.parquet"
  # Покадровый индекс. Без него неразличимы "кадр обработан, людей нет" и
  # "кадр не обработан", и знаменатель всех процентов S8 плывёт — именно так
  # и получаются нули в зонах.
  frames_index: "det/frames_index.parquet"

model:
  weights: "models/yolo11m.pt"   # веса ещё не скачаны; sha256 запишется в run_manifest при первом прогоне
  imgsz: 1280                 # 1280, а не 960: люди в дальней половине кадра мельче 32 px по высоте.
                              # Влезает в 8 ГБ при fp16 и batch 8 — проверяется правилом 4 на 3-минутном клипе.
  device: "cuda:0"
  precision: "fp16"           # 8 ГБ VRAM, fp32 не влезает
  batch: 8                    # НЕ ОТКАЛИБРОВАНО: подбирается замером VRAM на 3-минутном клипе
  classes: [0]                # только person
  tracker: null
  tracker_version: null

detect:
  conf_thr: 0.25              # НЕ ОТКАЛИБРОВАНО: дефолт ultralytics. Порог обязан быть выбран
                              # по кривой precision-recall на 300 размеченных кадрах (гейт S3).
  iou_nms: 0.70               # НЕ ОТКАЛИБРОВАНО: в плотной толпе люди перекрываются, и агрессивный
                              # NMS склеивает соседей. Проверяется на плотном куске.
  # Отсечка по глубине через прокси без ground truth — ВЫСОТУ РАМКИ.
  # Выведено из измеренного фокуса S1, а не «примерно»: h_px = f * H / Z.
  #   f = 1030 px (calib/homography.json, self_calib_pedestrians)
  #   H = 1.68 м (медиана роста выборки, она же источник масштаба)
  #   Z = 25 м -> 1030 * 1.68 / 25 = 69.2 px, округлено до 70.
  # Прежнее предложение 45 px соответствовало Z = 38 м, за концом улицы, и не
  # отсекало НИ ОДНОЙ детекции: замер (scripts/depth_cutoff.py) показал, что
  # медианная высота рамки не опускается ниже 52 px нигде в кадре.
  # ЗАВИСИТ ОТ МАСШТАБА, а масштаб взят из роста и независимо не подтверждён:
  # глубина отсечки в метрах наследует эту неопределённость.
  min_box_height_px: 70

  max_det: 300                # верхняя оценка числа людей в кадре на этой улице. НЕ ОТКАЛИБРОВАНО.
  max_frames: 108000        # ПОЛНЫЙ ЧАС при 30 fps. Было 5400 (3 минуты):
                            # с ним S3 молча обработал бы 3 минуты из часа,
                            # и весь downstream оказался бы трёхминутным.
                              # frames_index, а не исчезает.
  frame_stride: 3             # 3 для сквозного прогона: 10 эффективных fps вместо 30.
                              # Для полного прогона вернуть 1.
                              # 1 = обрабатывается каждый кадр. Пропущенные кадры
                              # попадают в frames_index со skip_reason=sampled_out,
                              # а не исчезают: знаменатель S8 обязан их видеть.
                              # Правило 4: при нехватке бюджета поднимать ЗДЕСЬ и
                              # записывать в JOURNAL, а не резать по ходу прогона.

budget:
  pilot_clip_s: 180           # правило 4: сначала 3 минуты, потом умножаем на 20
  max_full_run_s: 3600        # час обработки на час записи

gates:
  min_ap50_near: 0.60         # НЕ ОТКАЛИБРОВАНО
  min_ap50_far: 0.35          # дальняя половина заведомо хуже; отдельный порог, чтобы среднее не маскировало провал.
                              # НЕ ОТКАЛИБРОВАНО.
  n_labelled_frames: 300      # из CLAUDE.md

evidence_claims:
  - "claim.detect.near_half"    # что детектор видит в ближней половине
  - "claim.detect.far_half"     # и в дальней — именно там он врёт
  - "claim.detect.borderline"   # детекции у самого порога conf
