# S0 ingest — запись часа с YouTube live
# Правило 5 CLAUDE.md: у каждого порога есть комментарий "почему такое значение".
# "НЕ ОТКАЛИБРОВАНО" означает, что значение выбрано до измерений на этих данных
# и обязано попасть в отчёт с этой пометкой (правило 7).
schema_version: "1"
stage: "s0_ingest"

source:
  url: "https://www.youtube.com/watch?v=DjdUEyjx8GM"  # Kabukicho Ichiban-gai, Shinjuku
  duration_s: 3600            # час записи — объём задачи, задан постановкой
  out_dir: "raw"
  segment_seconds: 60         # сегмент в минуту: при обрыве теряется минута, а не час

model: null                   # на этом этапе модели нет; поле есть, чтобы манифест был единообразен

checks:
  fps_tolerance: 0.02         # 2% отклонения измеренного fps от номинального.
                              # НЕ ОТКАЛИБРОВАНО: взято как типичный джиттер HLS, на этом потоке не мерялось.
  max_total_gap_s: 30.0       # суммарные дыры > 30 с из часа (0.8%) делают почасовые доли недостоверными.
                              # НЕ ОТКАЛИБРОВАНО.
  max_single_gap_s: 10.0      # одна дыра длиннее 10 с рвёт треки насквозь и портит S4.
                              # НЕ ОТКАЛИБРОВАНО.
  require_stable_resolution: true   # смена разрешения делает гомографию S1 недействительной — падать сразу

evidence_claims:              # что этап ОБЯЗАН набрать пруфами (правило 1)
  - "claim.ingest.segment_boundary"   # стык сегментов: видно, что кадры не потеряны
  - "claim.ingest.frame_sample"       # случайные кадры записи: видно, что снят нужный ракурс
