# Отдача статики out/ на localhost. Именно nginx, а не python -m http.server:
# страница реплея перематывает видео, а для перемотки нужен HTTP Range.
# http.server его не реализует — mp4 грузился бы целиком и не искался.
server {
    listen       80;
    server_name  localhost;
    charset      utf-8;
    root         /usr/share/nginx/html;

    # Редиректа НЕТ намеренно. return 302 строил абсолютный URL из server_name
    # и терял порт: с localhost:8080 уводило на localhost/dashboard.html.
    # Отдаём дашборд напрямую по корню.
    absolute_redirect off;
    port_in_redirect  on;

    location / {
        index      dashboard.html;
        autoindex  on;                 # чтобы было видно все артефакты прогона
        add_header Cache-Control "no-store";   # страницы перегенерируются
    }

    # Видео. Range включён по умолчанию, здесь он только зафиксирован явно
    # и отключено кеширование, чтобы перерисованный оверлей не подменялся старым.
    location ~ \.(mp4|ts)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-store";
    }

    types {
        text/html   html;
        video/mp4   mp4;
        image/jpeg  jpg jpeg;
        image/png   png;
        application/json json;
        text/csv    csv;
    }
    default_type application/octet-stream;
}
